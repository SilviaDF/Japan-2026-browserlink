    <!-- Readable app typography plus retro pixel art mode -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&family=Literata:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --ww-deep-sea: #005f9e;
            --ww-ocean: #0077be;
            --ww-sky: #00a8e8;
            --ww-foam: #e0f4ff;
            --ww-sand: #fdf8e7;
            --ww-sand-dark: #f3e8c8;
            --ww-red-sail: #d9381e;
            --ww-gold: #facc15;
        }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            font-size: 13px;
            line-height: 1.45;
        }
        h1, h2, h3, .font-display {
            font-family: 'Outfit', system-ui, sans-serif;
        }
        .font-pixel {
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.03em;
        }
        /* Wind Waker Cel-Shaded Card Style */
        .ww-card {
            border: 2px solid #004270;
            box-shadow: 0 3px 0 #004270;
            border-radius: 14px;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .ww-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 0 #004270;
        }
        .ww-btn {
            border: 1.5px solid #00375e;
            box-shadow: 0 2px 0 #00375e;
            transition: all 0.1s ease;
        }
        .ww-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #00375e;
        }
        /* 16-Bit Pixel Love Style for Romantic Tab */
        .pixel-box {
            border: 3px solid #ff4d94;
            box-shadow: 
                0 0 0 2px #2d061b,
                4px 4px 0 0 #ff85b3,
                4px 4px 0 2px #2d061b;
            border-radius: 4px;
        }
        .pixel-card-light {
            background: #fff5f9;
            border: 2.5px solid #c9184a;
            box-shadow: 3px 3px 0px #800f2f;
            border-radius: 4px;
        }
        .pixel-btn {
            border: 2px solid #590d22;
            box-shadow: 2px 2px 0px #590d22;
            border-radius: 2px;
            transition: all 0.08s steps(2);
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #590d22;
        }
        .pixel-bg-pattern {
            background-color: #2b091c;
            background-image: 
                radial-gradient(#ff4d94 1px, transparent 1px),
                radial-gradient(#ff9ebb 1px, #2b091c 1px);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
        }
        @keyframes floatHeart {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-4px) scale(1.08); }
        }
        .animate-pixel-heart {
            animation: floatHeart 1.8s steps(4) infinite;
            display: inline-block;
        }
        /* Subtle custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e0f2fe; }
        ::-webkit-scrollbar-thumb { background: #0284c7; border-radius: 3px; }

        /* App polish: retain the original game-inspired visual identity. */
        html { scroll-behavior: smooth; }
        body { -webkit-tap-highlight-color: transparent; }
        .theme-windwaker { background:#fdf8e7; }
        .theme-pokemon { background:#fff7ed; }
        .theme-windwaker .ww-card { border-color:#004270; box-shadow:0 3px 0 #004270; }
        .theme-pokemon .ww-card { border-color:#7f1d1d; box-shadow:0 3px 0 #7f1d1d; }
        .theme-windwaker .ww-btn { border-color:#00375e; box-shadow:0 2px 0 #00375e; }
        .theme-pokemon .ww-btn { border-color:#7f1d1d; box-shadow:0 2px 0 #7f1d1d; }
        main { padding-bottom: 118px !important; }
        .travel-panel {
            background: #fff;
            border: 2px solid #004270;
            border-radius: 14px;

/* v17 · Pixel Love: the illustration stands on its own, without nested panels. */
.pixel-bg-pattern .pixel-love-artwork {
    width: min(100%, 320px);
    margin: 13px auto 24px;
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
    position: relative;
    isolation: isolate;
    text-align: center;
}
.pixel-bg-pattern .pixel-love-artwork::before {
    content: "";
    position: absolute;
    inset: -19px;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,191,225,.31) 0%, rgba(238,171,225,.14) 44%, transparent 73%);
    filter: blur(10px);
    pointer-events: none;
}
.pixel-bg-pattern .pixel-love-artwork-img {
    width: 100%;
    max-height: 410px;
    object-fit: contain;
    display: block;
    border: 0;
    border-radius: 13px;
    box-shadow: 0 9px 28px rgba(37,13,54,.24);
    image-rendering: pixelated;
}
@media (max-width: 600px) {
    .pixel-bg-pattern .pixel-love-artwork { width: min(76vw, 265px); margin: 10px auto 20px; }
}

/* Trip Atlas · cohesive Wind Waker / Pokédex map-first designer */
.trip-atlas-wrapper{--ta-accent:#08699b;--ta-deep:#073d5c;--ta-soft:#edf7fb;--ta-border:#d5e3e9;--ta-gold:#eebf55;--ta-ink:#20374b;font-family:'DM Sans',sans-serif;color:var(--ta-ink)}

.trip-atlas-wrapper *{box-sizing:border-box}
.trip-atlas-hero{background:linear-gradient(118deg,var(--ta-deep),var(--ta-accent));padding:23px 27px;border-radius:19px;color:white;box-shadow:0 7px 22px #214f7023;display:flex;gap:16px;justify-content:space-between;align-items:center}

.trip-atlas-hero h2 span{font-weight:500;color:#dceefa}
.trip-atlas-hero p{margin-top:8px;color:#e4f4fc;font-size:12px;line-height:1.55;max-width:600px}
.trip-atlas-hero-stats{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:235px;flex-shrink:0}
.trip-atlas-hero-stats span{background:#ffffff22;border:1px solid #ffffff2f;padding:6px 9px;border-radius:999px;white-space:nowrap;font-size:10px;font-weight:800}
.trip-atlas-daybar{margin:12px 0;display:flex;align-items:center;gap:12px;border:1px solid var(--ta-border);background:white;padding:10px 12px;border-radius:15px;min-width:0;box-shadow:0 3px 13px #214f700c}
.trip-atlas-daypicker{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.trip-atlas-daypicker button{width:35px;height:37px;border-radius:9px;color:var(--ta-accent);background:var(--ta-soft);font-size:23px;font-weight:800}
.trip-atlas-daypicker button:disabled{opacity:.3}
.trip-atlas-daypicker select{font:800 12px 'Outfit',sans-serif;border:1px solid var(--ta-border);background:white;max-width:235px;min-height:37px;border-radius:9px;padding:5px 10px;color:var(--ta-deep)}
.trip-atlas-daydetails{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.trip-atlas-daydetails strong{font:800 13px/1.3 'Outfit',sans-serif;color:var(--ta-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-atlas-daydetails span{font-size:10px;color:#698095}
.trip-atlas-to-planner{background:var(--ta-gold);color:#463617;min-height:35px;padding:7px 12px;border-radius:9px;font:800 11px 'Outfit',sans-serif;flex-shrink:0}
.trip-atlas-columns{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(310px,1.55fr) minmax(240px,1fr);gap:12px;align-items:stretch;min-height:600px}
.trip-atlas-explorer,.trip-atlas-map-pane,.trip-atlas-itinerary{background:#fff;border:1px solid var(--ta-border);border-radius:17px;overflow:hidden;box-shadow:0 5px 15px #28536a0b;min-width:0}
.trip-atlas-explorer,.trip-atlas-itinerary{display:flex;flex-direction:column;min-height:640px;max-height:750px}
.trip-atlas-panelhead{padding:15px 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e9eef1}
.trip-atlas-panelhead h3,.trip-atlas-map-title h3{font:850 17px 'Outfit',sans-serif;color:var(--ta-deep)}
.trip-atlas-panelhead p,.trip-atlas-map-title p{font-size:10px;color:#778596;margin-top:3px;line-height:1.35}
.trip-atlas-panelhead select{min-width:80px;max-width:115px;border:1px solid var(--ta-border);border-radius:9px;padding:6px;font-size:11px;font-weight:800;background:var(--ta-soft);color:var(--ta-deep)}
.trip-atlas-search{display:flex;gap:7px;align-items:center;margin:11px 12px 9px;padding:8px 10px;background:#f5f8fa;border:1px solid #dbe4ea;border-radius:10px;min-height:43px}
.trip-atlas-search>span{color:#7d94a6;font-size:19px}
.trip-atlas-search input{min-width:0;width:100%;background:transparent;outline:none;font-size:12px;color:#2b4359}
.trip-atlas-filters{padding:0 11px 8px;display:flex;flex-wrap:wrap;gap:5px}
.trip-atlas-filters button{border:1px solid var(--ta-border);border-radius:999px;padding:5px 8px;font:750 10px 'Outfit',sans-serif;color:#657c8d;background:white;min-height:30px}
.trip-atlas-filters button.chosen{background:var(--ta-deep);border-color:var(--ta-deep);color:#fff}
.trip-atlas-result-label{padding:5px 14px 9px;font-size:10px;color:#7b8c9b}
.trip-atlas-catalog{overflow-y:auto;flex:1;min-height:0;padding:0 9px 10px;overscroll-behavior:contain}
.trip-atlas-spot{border:1px solid transparent;border-bottom-color:#e8eef1;border-radius:10px;padding:7px 5px;margin-bottom:4px;transition:background .15s,border-color .15s}
.trip-atlas-spot:hover,.trip-atlas-spot.is-active{background:var(--ta-soft);border-color:var(--ta-border)}
.trip-atlas-spot-main{display:flex;text-align:left;align-items:flex-start;gap:8px;width:100%;padding:3px 3px 6px;min-height:39px}
.trip-atlas-spot-emoji{font-size:23px;min-width:30px;line-height:1.45}
.trip-atlas-spot-copy{flex:1;min-width:0}
.trip-atlas-spot-copy strong{display:block;font:750 11px/1.38 'Outfit',sans-serif;color:#284357}
.trip-atlas-spot-copy small{display:block;font-size:10px;color:#7b8f9b;margin-top:3px}
.trip-atlas-pin-flag{font-size:12px;color:#7490a1}
.trip-atlas-spot-controls{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:0 4px 1px}
.trip-atlas-spot-controls button,.trip-atlas-spot-controls a{min-height:29px;border-radius:7px;padding:5px 7px;font-size:11px;font-weight:800;background:#eff3f6;color:#47687e}
.trip-atlas-spot-controls .trip-atlas-mini-add{background:#e7f3fc;color:#12658b;margin-right:auto}
.trip-atlas-spot-controls .trip-atlas-mini-add:disabled{opacity:.55}
.trip-atlas-mini-star{font-size:18px!important;line-height:1!important}
.trip-atlas-mini-star.saved{color:#b17c04!important;background:#fff2d0!important}
.trip-atlas-panelnote{padding:10px 14px;font-size:10px;line-height:1.45;color:#728391;background:#f8fafb;border-top:1px solid #e8eef1}
.trip-atlas-map-pane{display:flex;flex-direction:column;min-height:640px}
.trip-atlas-map-title{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;gap:10px}
.trip-atlas-map-title>span{font:850 10px 'Outfit',sans-serif;background:var(--ta-soft);color:var(--ta-deep);border:1px solid var(--ta-border);padding:6px 11px;border-radius:99px}
.trip-atlas-map-frame{min-height:450px;flex:1;position:relative;background:#eaf2e9;isolation:isolate}
.trip-atlas-leaflet,.trip-atlas-offline{height:100%;width:100%;min-height:450px;z-index:0}
.trip-atlas-map-overlays{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.trip-atlas-map-tag{background:#fffef6ee;border-radius:11px;padding:8px 10px;font-size:10px;color:#17415a;font-weight:900;box-shadow:0 4px 12px #294d6433}
.trip-atlas-map-actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;pointer-events:auto}
.trip-atlas-map-actions button{min-height:33px;background:#fffefaee;box-shadow:0 4px 12px #294d6433;padding:5px 9px;border-radius:9px;color:#185d7e;font-size:10px;font-weight:850}
.trip-atlas-pin{min-width:33px;height:36px;border:3px solid white;border-radius:14px 14px 14px 4px;background:var(--pin-color);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 8px #19405a70;transform:rotate(-5deg)}
.trip-atlas-pin.active{border-color:#ffcf63;transform:rotate(0) scale(1.18);z-index:20}
.trip-atlas-pin.is-route{outline:2px solid #117eaa}
.trip-atlas-map-foot{position:absolute;z-index:490;bottom:8px;left:9px;right:9px;font-size:9px;line-height:1.3;text-align:center;background:#fffef5ea;border-radius:8px;padding:5px 7px;color:#577080;pointer-events:none}
.trip-atlas-location-note{position:absolute;top:57px;left:12px;z-index:550;background:#fffef5ee;border-radius:8px;padding:8px 10px;font-size:10px;color:#175a7b}
.trip-atlas-offline{position:relative;display:grid;place-items:center;overflow:hidden}
.trip-atlas-offline svg{width:100%;height:100%;min-height:450px;object-fit:cover}
.trip-atlas-offline-note{position:absolute;bottom:40px;left:10px;right:10px;text-align:center;font:800 11px 'Outfit',sans-serif;background:#fffcf1ec;padding:8px;border-radius:9px;color:#44657b}
.trip-atlas-focus{padding:11px 13px;border-top:1px solid var(--ta-border);background:#fff}
.trip-atlas-focus-head{display:flex;align-items:flex-start;gap:8px}
.trip-atlas-focus-head>span{font-size:23px}
.trip-atlas-focus-head strong{display:block;font:850 12px 'Outfit',sans-serif;color:var(--ta-deep)}
.trip-atlas-focus-head small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;line-height:1.5;color:#76899a;margin-top:3px}
.trip-atlas-focus-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.trip-atlas-focus-actions button,.trip-atlas-focus-actions a{background:var(--ta-accent);color:white;padding:8px 11px;min-height:35px;border-radius:9px;font:800 11px 'Outfit',sans-serif;text-decoration:none}
.trip-atlas-focus-actions button:disabled{background:#d8e5e8;color:#6c828d}
.trip-atlas-focus-actions button:nth-child(2){background:#f5e8b9;color:#71521a}
.trip-atlas-focus-actions a{background:#eef3f7;color:#29647b}
.trip-atlas-count{font-size:10px;color:var(--ta-accent);font-weight:800;background:var(--ta-soft);padding:7px 9px;border-radius:9px}
.trip-atlas-booking{background:#fff9e9;border:1px solid #f2d99e;padding:10px;margin:11px 12px 4px;border-radius:10px;display:flex;flex-direction:column;gap:3px}
.trip-atlas-booking b{font:850 11px 'Outfit',sans-serif;color:#825500}
.trip-atlas-booking span{font-size:11px;color:#5c4a24;font-weight:800}
.trip-atlas-booking small{color:#94733f;font-size:10px}
.trip-atlas-preset-caption{margin:11px 13px 6px;font-size:9px;font-weight:900;letter-spacing:.14em;color:#8895a2}
.trip-atlas-presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:0 12px 11px}
.trip-atlas-presets button{background:var(--ta-soft);border:1px solid var(--ta-border);border-radius:9px;padding:9px 5px;font:800 10px 'Outfit',sans-serif;color:var(--ta-deep);min-height:36px}
.trip-atlas-presets button:hover{background:#f4e7be}
.trip-atlas-stops{overflow-y:auto;flex:1;min-height:90px;padding:0 11px 9px;overscroll-behavior:contain}
.trip-atlas-stop{display:flex;align-items:flex-start;gap:8px;border:1px solid #e7edf1;border-radius:11px;padding:9px 7px;margin-bottom:7px;background:#fff}
.trip-atlas-stop-num{flex-shrink:0;display:grid;place-items:center;background:var(--ta-deep);color:#fff;width:23px;height:23px;border-radius:50%;font-size:10px;font-weight:900}
.trip-atlas-stop-copy{flex:1;min-width:0}
.trip-atlas-stop-copy strong{display:block;font:750 11px/1.4 'Outfit',sans-serif;overflow-wrap:anywhere}
.trip-atlas-stop-copy small{display:block;margin-top:3px;font-size:9px;color:#8c98a3}
.trip-atlas-locked{display:inline-block;font-size:9px;background:#fff2cb;color:#8c5f09;border-radius:6px;padding:3px 6px;margin-top:4px;font-weight:800}
.trip-atlas-stop-actions{display:flex;gap:2px;flex-shrink:0}
.trip-atlas-stop-actions button,.trip-atlas-stop-actions a{display:grid;place-items:center;width:27px;height:29px;background:#eef3f7;border-radius:7px;font-size:13px;font-weight:800;color:#4f6a7f;text-decoration:none}
.trip-atlas-stop-actions button:disabled{opacity:.26}
.trip-atlas-stop-actions .trip-atlas-delete{color:#bd4b57;background:#fff0f1}
.trip-atlas-add-form{display:flex;padding:8px 11px;gap:6px}
.trip-atlas-add-form input{min-width:0;flex:1;border:1px solid var(--ta-border);background:#f8fafb;border-radius:8px;padding:8px;font-size:11px}
.trip-atlas-add-form button{background:var(--ta-gold);color:#61451d;border-radius:8px;min-width:35px;font-size:19px;font-weight:900}
.trip-atlas-travelmode{padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #e7edf1;font-size:11px;font-weight:850}
.trip-atlas-travelmode>div{display:flex;gap:5px}
.trip-atlas-travelmode button{padding:7px 8px;background:#f0f4f7;border-radius:8px;color:#55748a;font-size:10px}
.trip-atlas-travelmode button.selected{background:var(--ta-deep);color:white}
.trip-atlas-directions{padding:4px 12px 10px;display:flex;flex-wrap:wrap;gap:6px}
.trip-atlas-directions a{display:inline-block;text-align:center;flex:1;min-width:140px;background:var(--ta-gold);color:#4d3e1d;border-radius:10px;padding:11px 8px;font:850 11px 'Outfit',sans-serif;text-decoration:none}
.trip-atlas-directions>span{font-size:10px;color:#778a9b}
.trip-atlas-right-foot{display:flex;gap:6px;justify-content:space-between;padding:0 12px 9px}
.trip-atlas-right-foot button{font-size:10px;color:var(--ta-accent);font-weight:800;padding:6px}
.trip-atlas-empty{padding:16px 11px;text-align:center;color:#788999;font-size:12px;line-height:1.6}
.trip-atlas-mobile-tabs{display:none}
@media(max-width:1170px){.trip-atlas-columns{grid-template-columns:minmax(210px,.75fr) minmax(270px,1.5fr) minmax(245px,1fr);gap:9px}.trip-atlas-hero{padding:19px}.trip-atlas-stops{padding:0 7px 8px}.trip-atlas-stop{gap:5px}.trip-atlas-stop-actions button,.trip-atlas-stop-actions a{width:24px}}
@media(max-width:930px){
 .trip-atlas-hero{padding:20px;flex-direction:column;align-items:flex-start;gap:9px}

 .trip-atlas-mobile-tabs button{min-height:46px;border:1px solid var(--ta-border);border-radius:12px;background:white;color:var(--ta-deep);font:850 12px 'Outfit',sans-serif}
 .trip-atlas-mobile-tabs button.active{background:var(--ta-deep);color:#fff;border-color:var(--ta-deep)}
 .trip-atlas-columns{display:block;min-height:0}
 .trip-atlas-columns>.trip-atlas-explorer,.trip-atlas-columns>.trip-atlas-map-pane,.trip-atlas-columns>.trip-atlas-itinerary{display:none;min-height:0;max-height:none}
 .trip-atlas-columns>.mobile-visible{display:flex}
 .trip-atlas-explorer.mobile-visible,.trip-atlas-itinerary.mobile-visible{max-height:none}
 .trip-atlas-catalog{overflow-y:visible;max-height:none}
 .trip-atlas-stops{overflow-y:visible;min-height:0}
 .trip-atlas-map-frame{min-height:400px}
 .trip-atlas-leaflet,.trip-atlas-offline{min-height:400px;height:400px}
 .trip-atlas-map-pane{min-height:0}
 .trip-atlas-map-actions{max-width:190px}
}
@media(max-width:440px){.trip-atlas-hero h2{font-size:26px}.trip-atlas-hero h2 span{display:block;font-size:21px}.trip-atlas-daypicker{width:100%}.trip-atlas-daypicker select{flex:1;max-width:none;min-width:0}.trip-atlas-to-planner{display:none}.trip-atlas-map-overlays{left:8px;right:8px;top:8px}.trip-atlas-map-tag{padding:7px 6px;max-width:110px;line-height:1.3}.trip-atlas-map-actions button{padding:6px}.trip-atlas-hero-stats span{font-size:9px}.trip-atlas-map-foot{font-size:8px}}

.trip-atlas-quest-details{margin:4px 10px;border:1px solid var(--ta-border);border-radius:10px;background:#f8fbfc;font-size:11px}
.trip-atlas-quest-details summary{padding:10px 11px;cursor:pointer;font:800 11px 'Outfit',sans-serif;color:var(--ta-deep)}
.trip-atlas-quest-list{padding:6px 9px;max-height:200px;overflow-y:auto}
.trip-atlas-quest-item{display:flex;gap:5px;align-items:center;padding:5px 0;border-top:1px solid #e5ecf0}
.trip-atlas-quest-item span{flex:1;font-size:10px;min-width:0}
.trip-atlas-quest-item button{background:#e7f3f8;border-radius:7px;min-height:28px;padding:4px 7px;color:#175e85;font-weight:800}
.trip-atlas-quest-list p{font-size:10px;color:#8497a3;padding:8px}

.trip-atlas-quest-hotel{display:flex;gap:6px;align-items:center;padding:5px 0 9px;font-size:10px;font-weight:800;color:#516c7e}
.trip-atlas-quest-hotel select{min-width:0;flex:1;border:1px solid var(--ta-border);background:white;border-radius:7px;font-size:10px;padding:5px}
.trip-atlas-quest-routes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.trip-atlas-quest-routes a{padding:8px 9px;background:var(--ta-gold);border-radius:8px;font-size:10px;font-weight:850;color:#4d3e1d;text-decoration:none}


/* V21: official OSM embed fallback for locally opened HTML and blocked raster tiles. */

/* V22 - the shared-trip panel follows both WW and Pokedex visual languages. */
.j22-launch{min-height:31px;border-radius:10px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;font-size:11px;font-family:Outfit,sans-serif;font-weight:800;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.j22-launch .j22-cloud-symbol{font-size:17px;line-height:1}
.j22-launch.is-on{background:#e8ffed;color:#075738;border-color:#9ae4bb}
.j22-launch.is-error{background:#ffe7e7;color:#8c2525}
.j22-launch:focus-visible{outline:3px solid #ffd44e;outline-offset:2px}
.j22-overlay{position:fixed;inset:0;z-index:250;background:rgba(8,29,49,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}
.j22-dialog{font-family:'DM Sans',system-ui,sans-serif;width:min(660px,100%);max-height:min(90vh,900px);max-height:min(90dvh,900px);display:flex;flex-direction:column;background:#fffdfa;color:#16304a;box-shadow:0 20px 64px rgba(0,22,48,.35);border:2px solid #0f5f99;border-radius:19px;overflow:hidden}

.j22-dialog-top h2{font-family:'Outfit',sans-serif;font-weight:800;font-size:23px;line-height:1.2;margin:6px 0 8px}
.j22-dialog-top p{font-size:12px;color:#eaf8ff;line-height:1.55;margin:0;max-width:490px}
.j22-eyebrow{font-family:'Outfit',sans-serif;font-size:10px;font-weight:800;letter-spacing:.11em;color:#ffe17d}
.j22-x{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);border-radius:9px;font-size:18px;color:#fff;min-width:37px;min-height:37px;cursor:pointer}
.j22-dialog-body{overflow-y:auto;overscroll-behavior:contain;padding:19px 24px 24px;display:flex;flex-direction:column;gap:15px}
.j22-status{display:flex;gap:11px;background:#f2f7fb;border:1px solid #d6e5ef;border-radius:12px;padding:12px 13px;align-items:start;color:#174468}
.j22-status strong{font-family:'Outfit',sans-serif;font-size:13px;display:block;margin-bottom:4px}
.j22-status small{font-size:11px;line-height:1.45;color:#536677;display:block}
.j22-status-dot{font-size:19px;color:#8d9db0;line-height:1}
.j22-status.connected .j22-status-dot{color:#1c9a64}
.j22-status.syncing .j22-status-dot,.j22-status.loading .j22-status-dot{color:#dca127}
.j22-status.error .j22-status-dot{color:#c63b42}
.j22-status.offline .j22-status-dot{color:#dc8727}
.j22-mode-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.j22-btn{border:1.5px solid #06558f;background:#0868a4;color:white;border-radius:10px;min-height:40px;padding:9px 13px;text-align:center;font-size:12px;font-family:Outfit,sans-serif;font-weight:800;cursor:pointer;box-shadow:0 2px 0 #073a62;transition:background .13s}
.j22-btn:hover{background:#005483}.j22-btn:disabled{opacity:.45;cursor:not-allowed}
.j22-btn-secondary{background:#fff;border-color:#c4d9e9;color:#085a93;box-shadow:none}.j22-btn-secondary:hover{background:#eef8fd}
.j22-help,.j22-connected,.j22-form{display:flex;flex-direction:column;gap:12px;background:#f8fbff;border:1px solid #dae8f3;padding:16px;border-radius:13px}
.j22-help p,.j22-connected p{line-height:1.55;font-size:12px;margin:0}
.j22-help strong,.j22-connected h3{font-size:16px;font-family:Outfit,sans-serif;color:#005a95;margin:0}

/* V24 — responsive audit: safe widths, accessible touch targets and one-column mobile cards */
html, body, #root { min-width:0; max-width:100%; }
#root * { box-sizing:border-box; }
main, main > *, .travel-panel, .ww-card, .atlas-heading, .jp23-planner, .trip-atlas-wrapper,
.trip-atlas-panel, .preview-grid, .archive-panel, .j22-dialog, .j22-dialog-body,
.j24-activity-page { min-width:0; max-width:100%; }
img, iframe, video, svg.pixel-love-scene { max-width:100%; }
input, textarea, select { max-width:100%; }
.phrase-compact-list { min-width:0; overflow:visible; }
.phrase-compact-row { min-width:0; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) auto; }
.phrase-compact-jp, .phrase-compact-meaning { min-width:0; overflow-wrap:anywhere; word-break:normal; }
.phrase-compact-jp { line-break:anywhere; }
.phrase-compact-actions { flex-wrap:wrap; justify-content:flex-end; }
.phrase-compact-actions button { min-width:42px; min-height:42px; padding:8px; }
.phrase-compact-footer { flex-wrap:wrap; }

// Official OpenStreetMap embed is hosted on openstreetmap.org, so the map tiles
// are requested from the site's own origin rather than a local file:// page.
// An embed can display one highlighted marker; normal HTTPS Leaflet mode
// continues to support multiple synchronized pins and route overlays.
function atlasEmbeddedMap(places, selectedId, routeStops, city) {
 const chosen=places.find(p=>p.id===selectedId && p.coords);
 const center=TRIP_ATLAS_CENTERS[city]||TRIP_ATLAS_CENTERS.Tokyo;
 let coords;
 if(chosen) coords=[chosen.coords];
 else {
  coords=routeStops.map(atlasCoordinates).filter(Boolean);
  if(!coords.length)coords=places.filter(p=>p.coords).slice(0,35).map(p=>p.coords);
 }
 if(!coords.length)coords=[center];
 const lats=coords.map(c=>c[0]), lons=coords.map(c=>c[1]);
 let south=Math.min(...lats),north=Math.max(...lats),west=Math.min(...lons),east=Math.max(...lons);
 const latPad=Math.max(.012,(north-south)*.21),lonPad=Math.max(.019,(east-west)*.21);
 south-=latPad;north+=latPad;west-=lonPad;east+=lonPad;
 const bbox=[west,south,east,north].map(x=>x.toFixed(6)).join('%2C');
 const marker=chosen?'&marker='+chosen.coords[0].toFixed(6)+'%2C'+chosen.coords[1].toFixed(6):'';
 const src='https://www.openstreetmap.org/export/embed.html?bbox='+bbox+'&layer=mapnik'+marker;
 const lat=chosen?chosen.coords[0]:center[0],lon=chosen?chosen.coords[1]:center[1];
 const full='https://www.openstreetmap.org/?mlat='+lat.toFixed(6)+'&mlon='+lon.toFixed(6)+'#map=14/'+lat.toFixed(6)+'/'+lon.toFixed(6);
 return {src,full};
}

   }

            const photos=new Map((Array.isArray(local)?local:[]).filter(n=>n.photo).map(n=>[n.id,n.photo]));
            merged=value.map(n=>photos.has(n.id)?{...n,photo:photos.get(n.id)}:n);
        }

        window.dispatchEvent(new CustomEvent('japan22:remote',{detail:{key:id,value:merged,by}}));
    };

        if(g!==generation || !cryptKey)return;
        const docs=snap.docs||[];
        for(const doc of docs){
            if(g!==generation)return;
            const id=doc.id;
            if(!(SHARED_KEYS.includes(id)||/^route_(?:[0-9]|1[0-8])$/.test(id)))continue;
            try {
                const obj=doc.data();
                const payload=await decryptValue(obj);
                const value=payload && typeof payload==='object' && Object.prototype.hasOwnProperty.call(payload,'value') ? payload.value : payload;
                applyRemote(id,value,payload && payload.by);
            }catch(e){emit({stage:'error',label:'Dati non decifrabili',detail:'Non sovrascrivo i tuoi dati locali. Verifica il codice condiviso.'});}
        }
    };
    const sendActivity=async(id,description)=>{
        if(!docRef || !cryptKey)return;
        const event={v:1,id,by:stored('name','Silvia/Ugo'),description,at:new Date().toISOString()};
        const enc=await encryptValue(event);
        const eid=bytesToUrl(crypto.getRandomValues(new Uint8Array(16)));
        await docRef.collection('activity').doc(eid).set({...enc,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    };
    const startActivityListener=g=>{
        try{
          eventUnsubscribe=docRef.collection('activity').orderBy('createdAt','desc').limit(75).onSnapshot(s=>{
            if(g!==generation)return;
            auditError='';auditSupported=true;
            (async()=>{
              const rows=[];
              for(const d of s.docs){try{const entry=await decryptValue(d.data());rows.push({...entry,recordId:d.id});}catch(e){}}
              if(g!==generation)return;
              recentActivity=rows;
              activityCallbacks.forEach(cb=>{try{cb([...rows]);}catch(e){}});
              emit({});
            })();
          },e=>{
            if(g!==generation)return;
            auditSupported=false;
            auditError='Il registro Novità richiede le nuove regole Firebase V24: Firestore Database → Rules → Publish. I dati del viaggio possono comunque sincronizzarsi.';
            emit({});

    };
    const refreshNow=async()=>{
      if(!ready||!docRef){
         if(stored('invite','')){await autoReconnect();if(!ready)throw new Error('Non collegato. Apri ☁️ Condividi per controllare la connessione.');}

      }

      await flushWrites();
      if(inFlight){for(let n=0;n<40 && inFlight;n++)await new Promise(resolve=>setTimeout(resolve,250));}
      if(dirty.size)throw new Error('Hai ancora '+dirty.size+' modifiche in attesa. Controlla le regole Firestore e Internet.');
      const g=generation;

      if(g!==generation)throw new Error('Connessione cambiata durante l’aggiornamento.');
      await consumeSnapshot(snapshot,g);
      lastServerRead=new Date().toISOString();
      emit({stage:'connected',label:'Controllato sul server',detail:'Lettura diretta da Firebase riuscita. Se mancano dati di Ugo, controllate che usiate lo stesso invito.',pending:0});

        emit({stage:'syncing',label:'Sincronizzazione…',pending:dirty.size});
        for(const [id,record] of work){
            const value=record.value;
            if(g!==generation)break;
            try{
                const enc=await encryptValue({value,by:stored('name','Silvia/Ugo').slice(0,40)});
                if(enc.ciphertext.length>600000)throw new Error('La sezione '+id+' supera il limite cloud (foto escluse).');
                await docRef.collection('entries').doc(id).set({...enc,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
                if(dirty.has(id)&&stringify(dirty.get(id)?.value)===stringify(value))dirty.delete(id);
                if(!dirty.has(id))rememberSynced(id,value);

                    try{await sendActivity(id,record.summary||japan24DescribeChange(id,null,value));}
                    catch(e){auditError='Registro non aggiornato: '+(e.message||String(e));emit({});}
                }

                emit({stage:'error',label:'Invio non riuscito',detail:e.message||String(e),pending:dirty.size});break;
            }
        }

        if(!dirty.size)initWriteMode=false;
        saveMeta('pendingTrip',stored('invite',''));saveMeta('pending',Object.fromEntries([...dirty].map(([id,obj])=>[id,obj.value])));
        if(g===generation && !dirty.size)emit({stage:'connected',label:'Sincronizzato',pending:0,detail:'Le modifiche appaiono anche sull’altro telefono.'});
        if(dirty.size && navigator.onLine){clearTimeout(sendTimer);sendTimer=setTimeout(flushWrites,12000);}
    };
    const connect = async (invite, name, mode) => {
        if(startupInProgress)throw new Error('Connessione già in corso.');
        startupInProgress=true;
        try{
            if(!navigator.onLine)throw new Error('Per la prima connessione serve Internet. I dati locali sono al sicuro.');
            if(!crypto?.subtle)throw new Error('La cifratura richiede HTTPS, localhost o l’APK Android.');
            const parsed=decodeInvitation(invite);
            resetConnection();const g=generation;currentInvite=parsed.code;
            baselineFingerprints=stored('syncedInvite','')===parsed.code?stored('syncedFingerprints',{}):{};
            emit({stage:'loading',label:'Collegamento…',detail:'Autenticazione e verifica del viaggio…',connected:false});
            const sdk=await ensureSDK();
            if(g!==generation)return;
            const appName='japan22-'+parsed.config.projectId;
            const app=sdk.apps.find(a=>a.name===appName) || sdk.initializeApp(parsed.config,appName);

            }else if(!trip.exists){throw new Error('Nessun viaggio trovato con questo codice. Controlla di averlo copiato per intero.');}
            // Back up only on first connection to this invite: retain the real pre-cloud snapshot on restarts.
            const todayBackupTag=parsed.code.slice(-12)+'_'+new Date().toISOString().slice(0,10);
            if(stored('backupInvite','')!==parsed.code || stored('rollingBackupTag','')!==todayBackupTag){
                backupLocal();saveMeta('backupInvite',parsed.code);saveMeta('rollingBackupTag',todayBackupTag);
            }
            saveMeta('invite',parsed.code);saveMeta('name',name.trim().slice(0,40)||'Silvia/Ugo');
            const isNew=mode==='create';
            // Baselines prevent initial app effects from uploading stale local values.
            for(const k of SHARED_KEYS){const v=sharedLocal(k);lastSeen[k]=stringify(v);lastValues.set(k,v);}
            const routes=sharedLocal(ROUTES_KEY);
            for(let i=0;i<19;i++){const v=(routes||{})[i]||null;lastSeen['route_'+i]=stringify(v);lastValues.set('route_'+i,v);}
            // Load durable unsent changes BEFORE reading remote state: never overwrite offline edits.
            const storedPending=stored('pendingTrip','')===parsed.code ? stored('pending',{}) : {};
            if(!isNew)for(const [id,v] of Object.entries(storedPending||{}))
                if(SHARED_KEYS.includes(id)||/^route_(?:[0-9]|1[0-8])$/.test(id))dirty.set(id,{value:v,silentActivity:true});
            const initial=await docRef.collection('entries').get({source:'server'});
            lastServerRead=new Date().toISOString();
            if(g!==generation)return;
            if(!isNew)await consumeSnapshot(initial,g);
            ready=true;
            if(isNew){
                dirty.clear();
                const content=localSnapshot();
                for(const key of SHARED_KEYS)dirty.set(key,{value:content[key],summary:'Dati condivisi importati'});
                for(let i=0;i<19;i++)dirty.set('route_'+i,{value:(content.dayRoutesV19||{})[i]||null,summary:'Import iniziale'});
            }
            unsubscribe=docRef.collection('entries').onSnapshot(s=>{
                snapshotQueue=snapshotQueue.then(()=>consumeSnapshot(s,g)).catch(e=>emit({stage:'error',label:'Lettura cloud non riuscita',detail:e.message||String(e)}));
                if(!s.metadata?.fromCache){lastServerRead=new Date().toISOString();emit({});}
            },e=>emit({stage:'error',label:'Connessione Firestore interrotta',detail:e.message||String(e)}));
            startActivityListener(g);
            initWriteMode=isNew;
            emit({stage:dirty.size?'syncing':'connected',label:dirty.size?'Invio dati locali…':'Sincronizzato',detail:'Viaggio condiviso collegato.',nickname:stored('name'),connected:true,pending:dirty.size});
            if(dirty.size)flushWrites();
        } catch(e){
            resetConnection();emit({stage:'error',label:'Non collegato',detail:e.message||String(e),connected:false});
            throw e;
        } finally {startupInProgress=false;}
    };
    const create = async (rawConfig,name) => {
        const config=publicConfig(rawConfig);
        const invitation=buildInvitation(config);
        await connect(invitation,name,'create');
        return invitation;
    };
    const join = async (invitation,name) => {
        await connect(invitation,name,'join');return invitation.trim();
    };
    const retryPending = () => { if(ready)flushWrites(); };
    const recoverLocalArchive = async () => {
        if(!ready)throw new Error('Collega prima questo dispositivo al cloud.');
        const backupId=stored('lastBackup','');
        const backup=stored(backupId,{});
        const local=Array.isArray(backup.previewNotes)?backup.previewNotes:[];
        const cloudArchive=sharedLocal('previewNotes');
        const existing=Array.isArray(cloudArchive)?cloudArchive:[];
        const ids=new Set(existing.map(x=>String(x.id)));
        const missing=local.filter(x=>x&&x.id&&!ids.has(String(x.id)));
        if(!missing.length)return 0;
        const next=[...missing,...existing];
        writeJapanStore(STORE_PREFIX+'previewNotes',next);
        window.dispatchEvent(new CustomEvent('japan22:remote',{detail:{key:'previewNotes',value:next,by:stored('name','')}}));
        await flushWrites();
        return missing.length;
    };
    const importLocalToShared = async () => {
        if(!ready)throw new Error('Prima collegati al viaggio.');
        const backupId=stored('lastBackup','');
        const content=backupId ? stored(backupId,localSnapshot()) : localSnapshot();
        for(const key of SHARED_KEYS)dirty.set(key,{value:content[key],summary:'Dati condivisi importati'});
        for(let i=0;i<19;i++)dirty.set('route_'+i,{value:(content[ROUTES_KEY]||{})[i]||null,summary:'Copia precedente importata'});

    };
    const disconnect=()=>{ resetConnection();saveMeta('invite','');saveMeta('pending',{});saveMeta('pendingTrip','');emit({...INFO,detail:'La copia locale rimane sul telefono.'}); };
    const autoReconnect = async () => {
        const invite=stored('invite',''); if(!invite)return;
        try{await join(invite,stored('name','Silvia/Ugo'));}catch(e){} // Show status in Cloud panel, preserve local copy.
    };
    window.addEventListener('online',()=>{if(ready){emit({stage:'syncing',label:'Connessione ripristinata…'});flushWrites();}else if(stored('invite',''))autoReconnect();});
    window.addEventListener('offline',()=>{if(ready)emit({stage:'offline',label:'Offline · dati locali',detail:'Riconnessione automatica al ritorno di Internet.'});});
    return {create,join,autoReconnect,disconnect,importLocalToShared,recoverLocalArchive,downloadBackup,retryPending,refreshNow,
        restoreBackup,onLocalValue,subscribe:cb=>{callbacks.add(cb);cb({...state});return()=>callbacks.delete(cb);},
        subscribeActivity:cb=>{activityCallbacks.add(cb);cb([...recentActivity]);return()=>activityCallbacks.delete(cb);},
        getRecentActivity:()=>[...recentActivity],
        getInfo:()=>({...state}),getInvite:()=>stored('invite',''),getName:()=>stored('name','')};

    React.useEffect(()=>{
      let startY=null,startX=0,armed=false;
      const begin=e=>{
         if(e.touches.length!==1 || window.scrollY>8 || document.querySelector('.j22-overlay'))return;
         const target=e.target;
         if(target.closest('.trip-atlas-leaflet,.trip-atlas-embed,.explore-live-map,.j22-dialog-body,.jp23-calendar,.phrase-tabs,input,textarea'))return;
         startY=e.touches[0].clientY;startX=e.touches[0].clientX;armed=false;
      };
      const move=e=>{
         if(startY===null)return;
         const dy=e.touches[0].clientY-startY,dx=e.touches[0].clientX-startX;
         if(dy>75&&dy>Math.abs(dx)*1.5&&window.scrollY<=8){armed=true;setPullMessage('Rilascia per sincronizzare ☁️');setPullVisible(true);}
         else if(dy<35){armed=false;setPullVisible(false);}
      };
      const end=async()=>{
         const shouldSync=armed;startY=null;armed=false;
         if(!shouldSync){setPullVisible(false);return;}
         setPullMessage('Controllo Firebase…');setPullVisible(true);
         try {await Japan22Cloud.refreshNow();setPullMessage('✓ Sincronizzazione controllata');}
         catch(e){setPullMessage('⚠ '+String(e.message||e).slice(0,75));}
         setTimeout(()=>setPullVisible(false),2300);
      };
      document.addEventListener('touchstart',begin,{passive:true});document.addEventListener('touchmove',move,{passive:true});
      document.addEventListener('touchend',end,{passive:true});

        }
        if (file.size > 12 * 1024 * 1024) {
            showToast('Foto troppo grande: massimo 12 MB prima del ridimensionamento.');
            return;
        }
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                try {
                    const cv = document.createElement('canvas');
                    const ratio = Math.min(1, 960 / Math.max(img.width, img.height));
                    cv.width = Math.max(1, Math.floor(img.width * ratio));
                    cv.height = Math.max(1, Math.floor(img.height * ratio));
                    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                    const photo = cv.toDataURL('image/jpeg', .73);
                    setJournalForm(p => ({ ...p, photo }));
                }
                catch (err) {
                    showToast('Foto non caricata: prova con un’altra immagine.');
                }
            };
            img.onerror = () => showToast('Foto non leggibile.');
